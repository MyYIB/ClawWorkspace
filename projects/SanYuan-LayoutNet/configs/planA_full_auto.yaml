project_name: SanYuan-LayoutNet
seed: 42

data:
  image_root: data/CLP_dataset/clp2k/images
  label_root: data/CLP_dataset/clp2k/labels_v2_auto
  image_size: [512, 512]
  num_workers: 0
  max_objects: 24
  min_objects: 1

model:
  name: Object3DLayoutNet
  d_model: 128
  num_layers: 2
  num_heads: 4
  obj_feat_dim: 16
  dropout: 0.1

train:
  batch_size: 2
  epochs: 20
  lr: 0.0002
  weight_decay: 0.01
  grad_clip: 1.0
  log_interval: 20

loss:
  w_proj: 1.0
  w_depth_rank: 0.7
  w_occ: 0.5
  w_rel: 0.3
  w_sanyuan_prior: 0.1

output:
  dir: outputs/planA_v2_full_auto
  save_every: 1
