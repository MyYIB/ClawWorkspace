project_name: SanYuan-LayoutNet
seed: 42

data:
  image_root: data/CLP_dataset/clp2k/images
  label_root: data/CLP_dataset/clp2k/labels_v2
  image_size: [768, 768]
  num_workers: 4

model:
  name: PolylineLayoutNet
  backbone: resnet34
  num_samples_per_curve: 64
  curve_hidden_dim: 256
  mask_decoder_dim: 128

train:
  batch_size: 8
  epochs: 80
  lr: 0.0002
  weight_decay: 0.01
  amp: true
  grad_clip: 1.0
  log_interval: 20
  val_interval: 1

loss:
  w_curve_l1: 2.0
  w_curve_smooth: 0.2
  w_order: 0.5
  w_mask_ce: 1.0
  w_mask_dice: 1.0

output:
  dir: outputs/planA_base
  save_topk: 3
