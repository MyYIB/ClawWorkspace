# Shanshui3D - 基础配置文件

# 项目信息
project:
  name: Shanshui3D
  version: 0.1.0
  description: "山水画空间意境重现 - 基于三远法的 3D 重建"

# 数据配置
data:
  root_dir: "data"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  image_size: [512, 512]
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

# 三远法配置
san_yuan:
  # 三远法参数范围 [0, 1]
  gaoyuan_range: [0.0, 1.0]    # 高远：自山下而仰山巅
  shenyuan_range: [0.0, 1.0]   # 深远：自山前而窥山后
  pingyuan_range: [0.0, 1.0]   # 平远：自近山而望远山
  
  # 默认意境配置
  default_preset:
    gaoyuan: 0.5
    shenyuan: 0.5
    pingyuan: 0.5

# 3D 重建配置
reconstruction:
  method: "nerf"  # 可选：nerf, 3dgs
  num_views: 100
  iterations: 30000
  aabb_scale: 2.0
  
  # NeRF 特定配置
  nerf:
    num_layers: 8
    hidden_dim: 256
    num_freqs: 10
    
  # 3DGS 特定配置
  3dgs:
    initial_points: 100000
    densify_until_iter: 15000

# 风格迁移配置
style:
  method: "clip"  # 可选：clip, gram, learned
  style_weight: 1.0
  content_weight: 0.1
  
  # 中国画风格特征
  chinese_painting:
    ink_strength: 0.7
    brush_texture: 0.5
    empty_space: 0.6  # 留白程度

# 训练配置
training:
  batch_size: 1
  learning_rate: 0.0001
  num_epochs: 100
  warmup_steps: 1000
  weight_decay: 0.0001
  
  # 优化器
  optimizer: "adamw"
  
  # 学习率调度
  scheduler:
    type: "cosine"
    min_lr: 0.00001

# 输出配置
output:
  root_dir: "outputs"
  checkpoint_dir: "outputs/checkpoints"
  render_dir: "outputs/renders"
  log_dir: "outputs/logs"
  
  # 保存频率
  save_every: 1000
  log_every: 100
  render_every: 500

# 设备配置
device:
  cuda: true
  gpu_id: 0
  mixed_precision: true

# 随机种子
seed: 42
